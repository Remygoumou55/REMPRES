<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<style>
  @font-face { font-family: "Playfair"; font-weight: 800; src: url(assets/playfair-800.woff2) format("woff2"); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; font-family: "Inter", sans-serif; }
  .cap { position: absolute; left: 70px; right: 70px; bottom: 170px; text-align: center; }
  .cap span { display: inline; font-size: 48px; font-weight: 700; line-height: 1.4; color: #f5f0e6; padding: 6px 18px;
    background: rgba(8,8,9,.78); border-radius: 10px; border-bottom: 3px solid rgba(212,176,98,.7);
    -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .head { position: absolute; left: 70px; right: 70px; text-align: center; }
  .head .l { display: inline-block; font-family: "Playfair"; font-weight: 800; line-height: 1.08; color: #f5f0e6;
    background: rgba(8,8,9,.82); padding: 14px 30px 18px; border: 2px solid rgba(212,176,98,.75); border-radius: 8px; box-shadow: 0 18px 44px rgba(0,0,0,.5); }
  .head .l.g { color: #0b0b0d; background: linear-gradient(100deg, #b98f3e, #f1dc9c 50%, #c99d48); border-color: transparent; }
</style></head>
<body><div id="root"></div>
<script>
const CAPS = [
  [0.00, 1.67, "Tu importes depuis des années."],
  [2.04, 4.79, "Mais sais-tu calculer ton transport sans ton transitaire ?"],
  [5.26, 7.60, "« Briser la peur d'importer » te donne les formules."],
  [7.95, 8.52, "Volume,"],
  [8.68, 10.47, "poids volumétrique,"],
  [10.61, 11.57, "valeur en douane,"],
  [11.84, 13.40, "coût de revient réel :"],
  [13.70, 15.13, "c'est là que se cache ta marge."],
  [15.40, 17.25, "Et c'est souvent là qu'on te la prend,"],
  [17.40, 18.45, "sans que tu le voies."],
  [18.57, 19.73, "Dans ce guide, tu trouves les formules,"],
  [19.89, 22.54, "des exercices corrigés, et des checklists prêtes à l'emploi"],
  [22.95, 24.28, "pour former ton équipe."],
  [24.54, 25.59, "Le guide et ses 3 kits :"],
  [25.65, 27.45, "au lieu de 5 000 francs, seulement"],
  [27.76, 29.54, "3 900 francs CFA."],
  [29.87, 31.32, "Le prix d'une seule erreur de calcul."],
];
const HEADS = [
  [0.00, 5.00, 1180, 84, [["Tu importes", ""], ["depuis des années…", ""], ["Mais sais-tu calculer ?", "g", 2.04]]],
  [15.40, 18.50, 1240, 86, [["C'est là qu'on", ""], ["te prend ta marge", "g", 16.60]]],
  [22.95, 24.54, 1300, 80, [["Pour former", ""], ["ton équipe", "g", 23.40]]],
];
const ease = (x) => 1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 3);
window.render = (t) => {
  let html = '';
  for (const [a, b, txt] of CAPS) if (t >= a - 0.05 && t <= b + 0.3) {
    const o = Math.min(ease((t - a + 0.05) / 0.25), 1 - ease((t - b - 0.05) / 0.25));
    html += `<div class="cap" style="opacity:${o}"><span>${txt}</span></div>`;
  }
  for (const [a, b, y, size, lines] of HEADS) {
    if (t < a || t > b) continue;
    const out = 1 - ease((t - (b - 0.4)) / 0.4);
    html += `<div class="head" style="top:${y}px;opacity:${out}">`;
    lines.forEach(([txt, cls, at]) => { const s = at ?? a; if (t < s) return; const p = ease((t - s) / 0.8);
      html += `<div style="margin-bottom:14px;opacity:${p};transform:translateY(${(1 - p) * 34}px)"><span class="l ${cls}" style="font-size:${size}px">${txt}</span></div>`; });
    html += '</div>';
  }
  document.getElementById('root').innerHTML = html;
};
</script></body></html>
