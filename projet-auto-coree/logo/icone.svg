<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#0B1F3A"/>
  <!-- Pont : arche dorée reliant deux rives -->
  <path d="M86 330 Q256 120 426 330" fill="none" stroke="#F2B33D" stroke-width="30" stroke-linecap="round"/>
  <!-- Tablier / route -->
  <rect x="70" y="322" width="372" height="26" rx="13" fill="#FFFFFF"/>
  <!-- Suspentes -->
  <g stroke="#F2B33D" stroke-width="10" stroke-linecap="round">
    <line x1="171" y1="246" x2="171" y2="322"/>
    <line x1="256" y1="226" x2="256" y2="322"/>
    <line x1="341" y1="246" x2="341" y2="322"/>
  </g>
  <!-- Rive Corée (rouge) / Rive Afrique (vert) -->
  <circle cx="86" cy="335" r="30" fill="#D7263D"/>
  <circle cx="426" cy="335" r="30" fill="#1FA45B"/>
  <!-- Lettre K -->
  <text x="256" y="445" text-anchor="middle" font-family="Inter, sans-serif" font-weight="800" font-size="92" fill="#FFFFFF" letter-spacing="6">K·B</text>
</svg>
